/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.8
        filter_size_map: 0.8
        cube_side_length: 1000.0
        runtime_pos_log_enable: true
        map_file_path: "./DARPA_TEST.pcd"

        common:
            # Topic Name after you run the Velodyne Decoder (see instructions)
            lid_topic:  "/velodyne_points"
            # The high-quality Alphasense IMU
            imu_topic:  "/alphasense_driver_ros/imu"
            
            time_sync_en: false         
            time_offset_lidar_to_imu: 0.0 

        preprocess:
            lidar_type: 2                # 2 = Velodyne
            scan_line: 16                # VLP-16 has 16 lines (Change from 32)
            scan_rate: 10                
            timestamp_unit: 2            
            blind: 0.5                   
            blind: 0.5                   # Reduced blind spot for this robot

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            extrinsic_est_en:  false     
            extrinsic_est_en:  false     # We have good extrinsics, so disable online estimation
            
            # FROM YOUR EXTRINSICS.YAML (lidar_to_imu_sensor_frame)
            # Translation: [0.00432, 0.03747, 0.06332]
            extrinsic_T: [ 0.00432, 0.03747, 0.06332 ]
            
            # Rotation: Yaw = 0.02618 rad (~1.5 degrees)
            # This matrix corresponds to that small yaw rotation
            extrinsic_R: [ 0.99966, -0.02618, 0.0, 
                           0.02618,  0.99966, 0.0, 
                           0.0,      0.0,     1.0]

        publish:
            path_en:  true
            scan_publish_en:  true       
            dense_publish_en: true       
            scan_bodyframe_pub_en: true  

        pcd_save:
            pcd_save_en: false          
            interval: -1
            pcd_save_en: false           # DISABLE internal saving to prevent RAM crash (use rosbag recording instead)
            interval: -1                 
